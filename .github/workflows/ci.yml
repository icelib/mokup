name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

env:
  LEFTHOOK: 0

concurrency:
  # Release PRs can emit both opened and synchronize events for the same bot
  # commit. Keep one authoritative run per PR and avoid competing Windows
  # process trees.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Remote Caching enabled - configure TURBO_TOKEN and TURBO_TEAM in repository settings
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Security Audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Migration Guards
        run: pnpm run guard:migration

      - name: Release tooling regression tests
        run: pnpm run test:release-tools

      - name: Repository Doctor
        run: pnpm exec repo doctor

      - name: Release Plan
        run: pnpm exec repo release plan --branch main --json

      - name: Lint
        # Running the workspace scripts directly avoids the intermittent
        # Turbo process-tree hang observed after all Windows lint tasks finish.
        # Lint tasks are independent; optional runtime peers must not create
        # ordering cycles with the playground's development dependencies.
        run: |
          pnpm run lint:root
          pnpm -r --if-present --workspace-concurrency=8 --no-sort run lint

      - name: Line Budget (guard)
        run: pnpm run lint:lines:guard

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Provider adapter matrix
        run: pnpm run test:provider-matrix

      - name: Deployment template smoke checks
        run: pnpm run test:deployment-templates

      - name: Mock package contract
        run: pnpm run test:mock-package-contract

      - name: Type Tests
        run: pnpm run test:types

      - name: Pack Artifacts
        run: pnpm run release:pack-check

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  runtime:
    name: Published Runtime (Node ${{ matrix.node-version }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.12.0, 24.22.1]
    env:
      LEFTHOOK: 0
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup build Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - uses: pnpm/action-setup@v6

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Build publishable packages
        run: pnpm run build:packages

      - name: Pack published packages and runtime compatibility fixtures
        run: node scripts/runtime-smoke.mjs --pack-only --dir .tmp/runtime-smoke

      - name: Setup consumer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test strict consumer installation and full runtime compatibility
        # This phase also runs check-runtime-compat.mjs --consumer, retaining
        # all public exports, network interception and runtime lifecycle checks.
        run: node scripts/runtime-smoke.mjs --runtime-only --dir .tmp/runtime-smoke

  vite-compat:
    name: Published Vite Compatibility
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: 0
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Build publishable packages
        run: pnpm run build:packages

      - name: Check published loader with Vite 5 through 8
        run: pnpm run test:vite-compat

  e2e:
    name: E2E Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: build
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Browser binaries use the cache; Linux system libraries still need setup
      # on every fresh runner, including when the browser cache is restored.
      - name: Install Playwright browsers and system dependencies
        run: pnpm exec playwright install chrome firefox webkit --with-deps

      - name: E2E Tests
        run: pnpm run test:e2e:serial

      - name: Browser network conformance
        run: pnpm run test:conformance

      - name: Built documentation and Service Worker smoke
        run: |
          pnpm run docs:build
          pnpm run docs:test:browser

      - name: D1 Authentication Tests
        run: pnpm run test:e2e:d1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            test-results-conformance
            apps/*/playwright-report
            apps/*/test-results
