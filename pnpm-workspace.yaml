packages:
  - apps/*
  - packages/*
  - '!**/test/**'
catalog:
  '@cloudflare/vite-plugin': ^1.64.0
  '@faker-js/faker': ^10.6.0
  '@hono/node-server': ^2.1.5
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^24.19.2
  '@vitejs/plugin-vue': ^6.0.10
  axios: ^1.20.0
  hono: ^4.13.13
  pathe: ^2.0.3
  rolldown: 1.2.14
  tailwindcss: ^4.3.3
  tsdown: 0.23.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vite: ^8.3.5
  vue: ^3.5.44
  vue-tsc: ^3.3.13
  wrangler: ^4.151.0
autoInstallPeers: true
strictPeerDependencies: false
resolutionMode: highest
packageExtensions:
  '@pnpm/fs.find-packages@1000.0.24':
    dependencies:
      '@pnpm/logger': 1001.0.1
pmOnFail: error
minimumReleaseAge: 1440
# Exact releases required by the reviewed repoctl 6.0.1 migration (2026-10-23).
# Keep the 24-hour policy for every other dependency and future version.
minimumReleaseAgeExclude:
  - repoctl@6.0.1
  - '@icebreakers/monorepo@6.0.1'
  - '@icebreakers/monorepo-templates@3.0.1'
  - '@icebreakers/commitlint-config@4.1.4'
  - '@icebreakers/eslint-config@8.0.11'
  - '@icebreakers/stylelint-config@5.1.5'
  - postcss-tailwindcss@3.1.5
  - stylelint-plugin-tailwindcss@3.1.5
strictDepBuilds: true
allowBuilds:
  '@prisma/engines': false
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  prisma: false
  sharp: true
  workerd: true
versioning:
  changelog:
    storage: repository
overrides:
  # stylelint's css-calc peer requires these compatible patch releases.
  stylelint@17.16.0>@csstools/css-parser-algorithms: 4.0.2
  stylelint@17.16.0>@csstools/css-tokenizer: 4.0.2
  '@asamuzakjp/css-color@5.1.11>@csstools/css-parser-algorithms': 4.0.2
  '@asamuzakjp/css-color@5.1.11>@csstools/css-tokenizer': 4.0.2
  adm-zip@<0.6.0: ^0.6.0
  cross-spawn@>=7.0.0 <7.0.5: ^7.0.5
  effect@<3.20.0: ^3.20.0
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  rollup@>=4.0.0 <4.59.0: ^4.59.0
  uuid@<11.1.1: ^11.1.1
  tar@>=7.0.0 <7.5.22: ^7.5.22
  path-to-regexp@>=8.0.0 <8.4.2: ^8.4.2
  linkify-it@>=5.0.0 <5.0.2: ^5.0.2
  postcss@>=8.0.0 <8.5.28: ^8.5.28
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  brace-expansion@>=1.0.0 <1.1.21: ^1.1.21
  ip-address@>=10.0.0 <10.7.3: ^10.7.3
  browserslist@>=4.0.0 <4.29.3: ^4.29.3
  baseline-browser-mapping@>=2.0.0 <2.11.27: ^2.11.27
  qs@>=6.0.0 <6.16.0: ^6.16.0
  '@humanfs/node@>=0.16.0 <0.16.8': ^0.16.8
  '@babel/core@>=7.0.0 <7.29.7': ^7.29.7
  body-parser@>=2.0.0 <2.3.0: ^2.3.0
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
  # This stable Drizzle release uses tsx; its old loader dependency is unused.
  drizzle-kit@0.31.11>@esbuild-kit/esm-loader: '-'
  drizzle-kit@0.31.11>tsx: ^4.23.15
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <7.29.4': ^7.29.4
  '@hono/node-server@>=1.0.0 <1.19.15': ^1.19.15
  hono@>=4.0.0 <4.13.13: ^4.13.13
  lodash@>=4.0.0 <4.17.24: ^4.17.24
  serialize-javascript@>=5.0.0 <7.0.5: ^7.0.5
  tinypool@>=2.0.0 <2.1.2: ^2.2.0
  # Keep Vite's optional transform types identical across workspace peers.
  vite@8.3.5>esbuild: 0.28.2
  # repoctl's test helpers must share Vitest's exact coverage-plugin peer version.
  '@icebreakers/monorepo@6.0.1>vitest': ~5.0.5
  markdown-it@>=14.0.0 <14.3.3: ^14.3.3
  launch-editor@<=2.14.1: ^2.14.2
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  sharp@>=0.35.0 <0.35.5: ^0.35.5
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  '@ungap/structured-clone@<1.3.1': ^1.3.1
  # Retain the validated KaTeX 0.18 line; 0.19 requires a separate API review.
  katex@>=0.11.0 <0.18.2: ~0.18.2
gitChecks: false
patchedDependencies:
  '@icebreakers/monorepo@6.0.1': patches/@icebreakers__monorepo@6.0.1.patch
