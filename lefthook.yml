# repoctl-managed: hooks/v1
glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    - name: eslint
      glob: '**/*.{js,jsx,mjs,ts,tsx,mts,cts,vue,astro,json,md,mdx,css,html,yml,yaml,scss}'
      # NUL-delimited paths preserve spaces, quotes and Unicode on every platform.
      # Keep these Git pathspecs aligned with glob above.
      run: >-
        git diff --cached --name-only --diff-filter=ACMR -z --
        '*.js' '*.jsx' '*.mjs' '*.ts' '*.tsx' '*.mts' '*.cts' '*.vue' '*.astro'
        '*.json' '*.md' '*.mdx' '*.css' '*.html' '*.yml' '*.yaml' '*.scss'
        | xargs -0 -r pnpm exec eslint --fix --no-warn-ignored --
      stage_fixed: true
    - name: stylelint
      glob: '**/*.{vue,css,scss,sass,less}'
      run: >-
        git diff --cached --name-only --diff-filter=ACMR -z --
        '*.vue' '*.css' '*.scss' '*.sass' '*.less'
        | xargs -0 -r pnpm exec stylelint --fix --allow-empty-input --
      stage_fixed: true
    - name: typecheck
      run: pnpm exec repo verify staged-typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec repo verify commit-msg "{1}"

pre-push:
  piped: true
  jobs:
    - name: lint
      run: pnpm lint
    - name: typecheck
      run: pnpm typecheck
